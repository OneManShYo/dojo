        // V2.0.1C: Arrow key navigation handled by setupInOutArrowKeys() function (see below)
        
        // Handle Loop Length changes - no longer needs to disable anything
        document.getElementById('loopLength').addEventListener('change', (e) => {
            // Loop length change doesn't affect In/Out points
        });
        
        // Spacebar for play/pause (universal DAW control)
        document.addEventListener('keydown', (e) => {
            // Only handle keys if not typing in an input field
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent page scroll
                
                if (!audioLoaded || !audioElement) return;
                
                if (audioElement.paused) {
                    // V2.4.0-B: Starting playback - check if we're in the In/Out range
                    // V2.4.0-J: Parse bar.beat format
                    // Beat positions are relative to Audio Start
                    const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                    const outBeat = barBeatToBeats(document.getElementById('outBeat').value);
                    const beatsPerSecond = audioTempo / 60.0;
                    
                    // Calculate current beat position relative to Audio Start
                    const currentAudioBeat = (audioElement.currentTime - audioStartTime) * beatsPerSecond;
                    
                    // If outside In/Out range, jump to In beat (relative to Audio Start)
                    if (currentAudioBeat < inBeat || currentAudioBeat >= outBeat) {
                        audioElement.currentTime = audioStartTime + (inBeat / beatsPerSecond);
                    }
                    
                    audioElement.play();
                } else {
                    audioElement.pause();
                }
            }
            
            // Arrow keys for beat-grid navigation (V2.0.1 - now jumps 1 beat instead of 1 bar)
            if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
                e.preventDefault(); // Prevent page scroll
                
                if (!audioLoaded || !audioElement) return;
                
                // V2.4.0-J: Parse bar.beat format
                const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                const outBeat = barBeatToBeats(document.getElementById('outBeat').value);
                const tempo = audioTempo;  // FIX: Use audioTempo, not currentTempo
                const beatsPerSecond = tempo / 60.0;
                
                // Get current position in beats
                const currentBeat = Math.floor(audioElement.currentTime * beatsPerSecond);
                
                let targetBeat;
                if (e.code === 'ArrowLeft') {
                    targetBeat = Math.max(inBeat, currentBeat - 1); // Go to previous beat, clamp at In beat
                } else {
                    targetBeat = Math.min(outBeat - 1, currentBeat + 1); // Go to next beat, clamp before Out beat
                }
                
                // Convert target beat to seconds
                const targetTime = targetBeat / beatsPerSecond;
                
                // Clamp to audio duration
                audioElement.currentTime = Math.min(targetTime, audioElement.duration);
            }
        });

        // Initialize WebGPU
        async function initWebGPU() {
            if (!navigator.gpu) {
                showStatus('WebGPU not supported. Please use Chrome/Safari on M1 Mac.', 'error');
                return false;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    showStatus('No WebGPU adapter found', 'error');
                    return false;
                }

                device = await adapter.requestDevice();
                canvas = document.getElementById('canvas');
                context = canvas.getContext('webgpu');
                
                const format = navigator.gpu.getPreferredCanvasFormat();
                context.configure({
                    device: device,
                    format: format,
                });

                updateCanvasSize();
                showStatus('WebGPU initialized successfully', 'success');
                return true;
                
            } catch (error) {
                showStatus('WebGPU initialization failed: ' + error.message, 'error');
                return false;
            }
        }

        function updateCanvasSize() {
            const resolution = parseInt(document.getElementById('resolution').value);
            const orientation = document.getElementById('orientation').value;
            let width, height;
            
            // Calculate dimensions based on orientation
            if (orientation === 'portrait') {
                // Portrait: 9:16 (e.g., 1080x1920)
                height = resolution;
                width = Math.round(height * (9 / 16));
            } else if (orientation === 'square') {
                // Square: 1:1 (e.g., 1080x1080)
                width = resolution;
                height = resolution;
            } else {
                // Landscape: 16:9 (e.g., 1920x1080)
                height = resolution;
                width = Math.round(height * (16 / 9));
            }
            
            canvas.width = width;
            canvas.height = height;
            
            // Scale display to fit container
            const container = canvas.parentElement;
            const containerRect = container.getBoundingClientRect();
            const aspectRatio = width / height;
            
            if (containerRect.width / aspectRatio <= containerRect.height * 0.9) {
                canvas.style.width = containerRect.width * 0.9 + 'px';
                canvas.style.height = (containerRect.width * 0.9) / aspectRatio + 'px';
            } else {
                canvas.style.height = containerRect.height * 0.9 + 'px';
                canvas.style.width = (containerRect.height * 0.9) * aspectRatio + 'px';
            }
            
            // Update status with current dimensions
            const orientationText = orientation === 'portrait' ? 'Portrait' : 
                                   orientation === 'square' ? 'Square' : 'Landscape';
            showStatus(`${resolution}p ${orientationText} (${width}x${height})`, 'success');
        }

        // Compile shader
        async function compileShader(resetAudio = false) {
            if (!device) return;

            const shaderCode = document.getElementById('shaderCode').value;
            
            // Create vertex shader (fullscreen quad)
            const vertexShaderCode = `
                @vertex
                fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4<f32> {
                    var pos = array<vec2<f32>, 6>(
                        vec2<f32>(-1.0, -1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>(-1.0,  1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>( 1.0,  1.0),
                        vec2<f32>(-1.0,  1.0)
                    );
                    return vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                }
            `;

            // Add uniform structure to fragment shader with Tempo and Mods
            const fragmentShaderCode = `
                struct Uniforms {
                    time: f32,
                    tempo: f32,
                    modA: f32,
                    modB: f32,
                    modC: f32,
                    padding1: f32,
                    resolutionX: f32,
                    resolutionY: f32,
                }

                @group(0) @binding(0) var<uniform> uniforms: Uniforms;

                ${shaderCode}
            `;

            try {
                const shaderModule = device.createShaderModule({
                    code: vertexShaderCode + '\n' + fragmentShaderCode
                });

                // Create uniform buffer - 48 bytes for proper 16-byte alignment
                uniformBuffer = device.createBuffer({
                    size: 48,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });

                // Create bind group layout
                const bindGroupLayout = device.createBindGroupLayout({
                    entries: [{
                        binding: 0,
                        visibility: GPUShaderStage.FRAGMENT,
                        buffer: { type: 'uniform' }
                    }]
                });

                // Create bind group
                uniformBindGroup = device.createBindGroup({
                    layout: bindGroupLayout,
                    entries: [{
                        binding: 0,
                        resource: { buffer: uniformBuffer }
                    }]
                });

                // Create render pipeline
                pipeline = device.createRenderPipeline({
                    layout: device.createPipelineLayout({
                        bindGroupLayouts: [bindGroupLayout]
                    }),
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vs_main'
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: 'fs_main',
                        targets: [{
                            format: navigator.gpu.getPreferredCanvasFormat()
                        }]
                    },
                    primitive: {
                        topology: 'triangle-list'
                    }
                });

                startTime = Date.now();
                
                // Handle audio - only reset on manual compile, otherwise preserve state
                if (audioLoaded && audioElement) {
                    if (resetAudio) {
                        // Manual compile: reset to In beat and play
                        // V2.4.0-J: Parse bar.beat format
                        const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                        const beatsPerSecond = audioTempo / 60.0;  // FIX: Use audioTempo, not currentTempo
                        const inBeatTime = inBeat / beatsPerSecond;
                        audioElement.currentTime = inBeatTime;
                        audioElement.play().catch(() => {});
                    }
                    // Otherwise: preserve position and play state (do nothing)
                }
                
                showStatus('Shader compiled - Tempo: ' + currentTempo + ' BPM | Mods: A/B/C Active', 'success');
                
                if (!animationId) {
                    render();
                }
                
                // V2.8.0-A: Announce shader name update to DojoLive
                announcePresence();
                
                // V2.8.0-B: Capture and broadcast canvas snapshot after 1 frame
                setTimeout(() => {
                    broadcastSnapshot();
                }, 100); // Wait 100ms for render to complete
                
            } catch (error) {
                showStatus('Shader compilation error: ' + error.message, 'error');
            }
        }

        // Render loop
        function render() {
            if (!device || !pipeline) {
                animationId = requestAnimationFrame(render);
                return;
            }

            const currentTime = (Date.now() - startTime) / 1000.0;
            const beatsPerSecond = currentTempo / 60.0;
            let beat = currentTime * beatsPerSecond;
            
            // Apply loop length wrapping
            const loopLengthValue = document.getElementById('loopLength').value;
            let totalBeatsInLoop = 0;
            
            // Handle meta-modes for loop length
            if (loopLengthValue === 'chaos') {
                // Random loop length every 4 bars (16 beats)
                const currentSegment = Math.floor(beat / 16);
                const loopOptions = [1, 2, 4, 8, 16, 32, 64];
                const selectedLoop = loopOptions[Math.floor(Math.abs(Math.sin(currentSegment * 78.233) * 43758.5453) % loopOptions.length)];
                totalBeatsInLoop = selectedLoop;
            } else if (loopLengthValue === 'cycler') {
                // Cycle through loop lengths progressively (changes every 4 bars)
                const currentSegment = Math.floor(beat / 16);
                const loopOptions = [1, 2, 4, 8, 16, 32];
                totalBeatsInLoop = loopOptions[currentSegment % loopOptions.length];
            } else if (loopLengthValue === 'madmax') {
                // Aggressive loop lengths (changes every 2 bars)
                const currentSegment = Math.floor(beat / 8);
                const loopOptions = [0.25, 1, 4, 16];
                totalBeatsInLoop = loopOptions[currentSegment % loopOptions.length];
            } else if (loopLengthValue === 'psycho') {
                // Rapid loop length changes (every bar)
                const currentBar = Math.floor(beat / 4);
                const loopOptions = [0.25, 0.5, 1, 2, 4];
                totalBeatsInLoop = loopOptions[Math.floor(Math.abs(Math.sin(currentBar * 12.9898) * 43758.5453) % loopOptions.length)];
            } else {
                // Numeric value - use directly as beats
                totalBeatsInLoop = parseFloat(loopLengthValue);
            }
            
            // Apply loop wrapping if loop length > 0
            if (totalBeatsInLoop > 0) {
                beat = beat % totalBeatsInLoop;
            }
            
            // Get mod settings
            const modASubdivValue = document.getElementById('modASubdiv').value;
            const modAWaveform = document.getElementById('modAWaveform').value;
            const modBSubdivValue = document.getElementById('modBSubdiv').value;
            const modBWaveform = document.getElementById('modBWaveform').value;
            const modCSubdivValue = document.getElementById('modCSubdiv').value;
            const modCWaveform = document.getElementById('modCWaveform').value;
            
            // Calculate dynamic subdivisions for meta-modes
            let modASubdiv, modBSubdiv, modCSubdiv;
            
            // Mod A Subdivision
            if (modASubdivValue === 'chaos') {
                const currentBar = Math.floor(beat / 4);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modASubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBar * 78.233) * 43758.5453) % subdivOptions.length)];
            } else if (modASubdivValue === 'cycler') {
                const currentSegment = Math.floor(beat / 16);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modASubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modASubdivValue === 'madmax') {
                const currentSegment = Math.floor(beat / 8);
                const subdivOptions = [4, 0.25, 1];
                modASubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modASubdivValue === 'psycho') {
                const currentBeat = Math.floor(beat);
                const subdivOptions = [1, 0.5, 0.25];
                modASubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBeat * 12.9898) * 43758.5453) % subdivOptions.length)];
            } else {
                modASubdiv = parseFloat(modASubdivValue);
            }
            
            // Mod B Subdivision
            if (modBSubdivValue === 'chaos') {
                const currentBar = Math.floor(beat / 4);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modBSubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBar * 78.233) * 43758.5453) % subdivOptions.length)];
            } else if (modBSubdivValue === 'cycler') {
                const currentSegment = Math.floor(beat / 16);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modBSubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modBSubdivValue === 'madmax') {
                const currentSegment = Math.floor(beat / 8);
                const subdivOptions = [4, 0.25, 1];
                modBSubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modBSubdivValue === 'psycho') {
                const currentBeat = Math.floor(beat);
                const subdivOptions = [1, 0.5, 0.25];
                modBSubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBeat * 12.9898) * 43758.5453) % subdivOptions.length)];
            } else {
                modBSubdiv = parseFloat(modBSubdivValue);
            }
            
            // Mod C Subdivision
            if (modCSubdivValue === 'chaos') {
                const currentBar = Math.floor(beat / 4);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modCSubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBar * 78.233) * 43758.5453) % subdivOptions.length)];
            } else if (modCSubdivValue === 'cycler') {
                const currentSegment = Math.floor(beat / 16);
                const subdivOptions = [4, 2, 1, 0.5, 0.25];
                modCSubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modCSubdivValue === 'madmax') {
                const currentSegment = Math.floor(beat / 8);
                const subdivOptions = [4, 0.25, 1];
                modCSubdiv = subdivOptions[currentSegment % subdivOptions.length];
            } else if (modCSubdivValue === 'psycho') {
                const currentBeat = Math.floor(beat);
                const subdivOptions = [1, 0.5, 0.25];
                modCSubdiv = subdivOptions[Math.floor(Math.abs(Math.sin(currentBeat * 12.9898) * 43758.5453) % subdivOptions.length)];
            } else {
                modCSubdiv = parseFloat(modCSubdivValue);
            }
            
            // Calculate mod values
            let modA = calculateMod(beat, modASubdiv, modAWaveform);
            let modB = calculateMod(beat, modBSubdiv, modBWaveform);
            let modC = calculateMod(beat, modCSubdiv, modCWaveform);
            
            // Get gain values
            const modAGain = parseFloat(document.getElementById('modAGain').value);
            const modBGain = parseFloat(document.getElementById('modBGain').value);
            const modCGain = parseFloat(document.getElementById('modCGain').value);
            
            // Apply audio analysis if loaded, otherwise just use gains as multipliers
            if (audioLoaded && audioElement && !audioElement.paused) {
                // V2.4.0-B: Check In/Out beat boundaries and loop audio
                // V2.4.0-J: Parse bar.beat format
                // Beat positions are relative to Audio Start
                const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                const outBeat = barBeatToBeats(document.getElementById('outBeat').value);
                const audioBeatsPerSecond = audioTempo / 60.0;  // V2.5.0-W: Use Audio Tempo for audio calculations
                const currentAudioBeat = (audioElement.currentTime - audioStartTime) * audioBeatsPerSecond;
                
                // V2.2.0-F: Only loop if loopEnabled is true
                // V2.5.0-T: Check slightly before outBeat (0.05 beat threshold) to prevent overshoot
                // V2.5.0-V: Increased to 0.15 beat threshold (~75ms @ 120 BPM) for tighter loop
                // V2.5.0-W: Fixed loop-back using Audio Tempo instead of Shader Tempo
                if (loopEnabled && currentAudioBeat >= (outBeat - 0.15)) {
                    audioElement.currentTime = audioStartTime + (inBeat / audioBeatsPerSecond);
                }
                
                const audioLevels = analyzeAudio();
                modA *= (audioLevels.bass * modAGain);
                modB *= (audioLevels.mid * modBGain);
                modC *= (audioLevels.treble * modCGain);
            } else {
                // No audio - gains just multiply the mod values directly
                modA *= modAGain;
                modB *= modBGain;
                modC *= modCGain;
            }
            
            // Update uniforms: 12 floats = 48 bytes for proper alignment
            const uniformData = new Float32Array([
                currentTime,
                currentTempo,
                modA,
                modB,
                modC,
                0, // padding
                canvas.width,
                canvas.height,
                0, // padding
                0, // padding
                0, // padding
                0  // padding
            ]);
            
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            // Render
            const commandEncoder = device.createCommandEncoder();
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                    loadOp: 'clear',
                    storeOp: 'store'
                }]
            });

            renderPass.setPipeline(pipeline);
            renderPass.setBindGroup(0, uniformBindGroup);
            renderPass.draw(6);
            renderPass.end();

            device.queue.submit([commandEncoder.finish()]);
            
            // Update render progress counter if rendering
            if (isRendering && renderStartTime > 0) {
                const elapsedTime = (Date.now() - renderStartTime) / 1000;
                const currentFrame = Math.floor(elapsedTime * renderFPS);
                
                // Update status every 5 frames (reduce overhead)
                if (currentFrame % 5 === 0 || currentFrame >= totalFrames - 1) {
                    const elapsedText = secondsToTimeString(Math.min(elapsedTime, renderDuration));
                    const totalText = secondsToTimeString(renderDuration);
                    showStatus(`Rendering ${elapsedText}/${totalText} | Frame ${currentFrame}/${totalFrames}`, 'info');
                }
            }
            
            animationId = requestAnimationFrame(render);
        }

        // Start video rendering
        async function startRender() {
            if (isRendering) return;
            
            isRendering = true;
            const renderBtn = document.getElementById('renderBtn');
            renderBtn.classList.add('rendering');
            renderBtn.disabled = true;
            
            // Show render progress in status bar (keep canvas visible)
            showStatus('Setting up render...', 'info');
            
            try {
                // V2.5.0-D: Calculate duration based on audio loaded state
                let duration;
                let beatCount;
                const shaderTempo = parseInt(document.getElementById('tempo').value);
                
                if (audioLoaded && audioElement) {
                    // AUDIO MODE: Use Loop In/Out brackets and Audio Tempo
                    const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                    const outBeat = barBeatToBeats(document.getElementById('outBeat').value);
                    const audioBPM = audioTempo; // Audio Tempo field (not Shader Tempo!)
                    
                    beatCount = outBeat - inBeat;
                    duration = (beatCount * 60) / audioBPM;
                } else {
                    // NO AUDIO MODE: Use Shader Render Duration field (MM:SS.mmm format)
                    const renderDurationStr = document.getElementById('renderDuration').value;
                    duration = timeStringToSeconds(renderDurationStr);
                    beatCount = Math.ceil((duration * shaderTempo) / 60);
                }
                
                const fps = parseInt(document.getElementById('fps').value);
                const resolution = document.getElementById('resolution').value;
                const orientation = document.getElementById('orientation').value;
                
                // V2.6.0-R: Parse shader name from code if filename field empty
                let filename = document.getElementById('filename').value.trim();
                if (!filename) {
                    const shaderCode = document.getElementById('shaderCode').value;
                    const parsedName = parseShaderNameFromCode(shaderCode);
                    filename = parsedName || 'filename';
                }
                
                // Capture canvas stream
                // FIX V2.0.1G: Use captureStream() without FPS parameter to capture every rendered frame
                // This prevents video freezing when browser throttles requestAnimationFrame
                // MediaRecorder will handle framerate encoding based on actual captured frames
                const canvasStream = canvas.captureStream();
                
                // Add audio track if loaded
                let combinedStream = canvasStream;
                if (audioLoaded && audioElement && audioContext) {
                    // AUDIO MODE: Calculate Loop In offset and sync audio
                    const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
                    const audioBPM = audioTempo; // Audio Tempo field (not Shader Tempo!)
                    const inBeatTime = inBeat / (audioBPM / 60.0);
                    
                    // Reset audio to In beat
                    audioElement.currentTime = inBeatTime;
                    
                    // V2.5.0-C: Offset startTime so visual rendering starts at Loop In position
                    startTime = Date.now() - (inBeatTime * 1000);
                    
                    // Create destination for capturing audio
                    const audioDest = audioContext.createMediaStreamDestination();
                    
                    // Disconnect from existing connections and reconnect for recording
                    if (audioSource) {
                        audioSource.disconnect();
                        audioSource.connect(analyser);
                        audioSource.connect(audioDest);
                        audioSource.connect(audioContext.destination);
                    }
                    
                    // Start audio playback
                    audioElement.play();
                    
                    // Combine video and audio tracks
                    combinedStream = new MediaStream([
                        ...canvasStream.getVideoTracks(),
                        ...audioDest.stream.getAudioTracks()
                    ]);
                } else {
                    // NO AUDIO MODE: Reset startTime to start from beat 0
                    startTime = Date.now();
                }
                
                const mediaRecorder = new MediaRecorder(combinedStream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 8000000 // High quality
                });
                
                const chunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    let orientationSuffix = '_L';
                    if (orientation === 'portrait') {
                        orientationSuffix = '_P';
                    } else if (orientation === 'square') {
                        orientationSuffix = '_S';
                    }
                    a.href = url;
                    a.download = `OMS_${filename}_${resolution}p_${fps}fps${orientationSuffix}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    finishRender('Video rendered successfully!');
                };
                
                mediaRecorder.start();
                
                // Initialize render tracking
                renderStartTime = Date.now();
                renderDuration = duration;
                renderFPS = fps;
                totalFrames = Math.floor(duration * fps);
                
                const totalText = secondsToTimeString(duration);
                showStatus(`Rendering 00:00/${totalText} | Frame 0/${totalFrames}`, 'info');
                
                setTimeout(() => {
                    mediaRecorder.stop();
                }, duration * 1000);
                
            } catch (error) {
                finishRender('Render failed: ' + error.message, true);
            }
        }

        function finishRender(message, isError = false) {
            isRendering = false;
            
            // Reset render tracking
            renderStartTime = 0;
            renderDuration = 0;
            totalFrames = 0;
            renderFPS = 0;
            
            const renderBtn = document.getElementById('renderBtn');
            renderBtn.classList.remove('rendering');
            renderBtn.disabled = false;
            
            // Stop audio if playing
            if (audioLoaded && audioElement) {
                audioElement.pause();
                audioElement.currentTime = 0;
            }
            
            // Show result in status bar
            showStatus(message, isError ? 'error' : 'success');
        }

        function showStatus(message, type = '') {
            const status = document.getElementById('shaderStatus');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        // V2.1.1-C: Copy shader code to clipboard
        function copyShaderCode() {
            const shaderCode = document.getElementById('shaderCode').value;
            navigator.clipboard.writeText(shaderCode).then(() => {
                showStatus('Shader code copied to clipboard!', 'success');
            }).catch(err => {
                showStatus('Failed to copy shader code', 'error');
            });
        }

        // V2.6.0-R: Parse shader name from code comment
        function parseShaderNameFromCode(shaderCode) {
            // Look for pattern: // ONEMANSHYO Dojo [version] - ShaderName
            const lines = shaderCode.split('\n');
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('// ONEMANSHYO Dojo')) {
                    // Find last dash and extract name after it
                    const lastDashIndex = trimmed.lastIndexOf(' - ');
                    if (lastDashIndex !== -1) {
                        const shaderName = trimmed.substring(lastDashIndex + 3).trim();
                        // Clean name: remove special chars, keep alphanumeric and basic chars
                        const cleanName = shaderName.replace(/[^a-zA-Z0-9_-]/g, '');
                        if (cleanName.length > 0) {
                            return cleanName;
                        }
                    }
                }
            }
            return null; // No shader name found
        }

        // V2.1.1-C: Export shader code as .txt file
        function exportShaderTxt() {
            const shaderCode = document.getElementById('shaderCode').value;
            const filename = document.getElementById('filename').value.trim();
            
            // V2.6.0-P: Version for shader code export
            const omsVersion = 'V2.6.0';
            
            // V2.6.0-R: Parse shader name from code if filename field empty
            let effectiveName = filename;
            if (!effectiveName) {
                const parsedName = parseShaderNameFromCode(shaderCode);
                effectiveName = parsedName || 'filename';
            }
            
            // Generate filename: OMS_{name}_Shader_{version}.txt
            const txtFilename = `OMS_${effectiveName}_Shader_${omsVersion}.txt`;
            
            // Create blob and download
            const blob = new Blob([shaderCode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = txtFilename;
            a.click();
            URL.revokeObjectURL(url);
            
            showStatus(`Shader exported as ${txtFilename}`, 'success');
        }

        function showLoopDuration() {
            // V2.4.0-J: Parse bar.beat format from fields
            const inBeat = barBeatToBeats(document.getElementById('inBeat').value);
            const outBeat = barBeatToBeats(document.getElementById('outBeat').value);
            const tempo = parseInt(document.getElementById('tempo').value) || 120;
            
            const beatCount = Math.max(0, outBeat - inBeat);
            const durationSeconds = (beatCount * 60) / tempo;
            
            // Convert beats to bar.beat format (DAW-style notation)
            // Example: 17 beats = 4.1 bars (4 bars + 1 beat)
            const bars = Math.floor(beatCount / 4);
            const fractionalBeats = beatCount % 4;
            const barsDisplay = (bars + fractionalBeats * 0.1).toFixed(1);
            
            showStatus(`${barsDisplay} bars / ${beatCount} beats / ${durationSeconds.toFixed(1)}s`, 'success');
        }

        // V2.1.1-I: IN/OUT label click handlers
        function setInToStart() {
            if (audioElement) {
                // V2.4.0-J: Output bar.beat format
                document.getElementById('inBeat').value = beatsToBarBeat(0);
                showLoopDuration();
            }
        }

        function setOutToEnd() {
            if (audioElement && audioElement.duration > 0) {
                const tempo = audioTempo;  // Use audio tempo
                const beatsPerSecond = tempo / 60;
                const totalBeats = Math.ceil(audioElement.duration * beatsPerSecond);
                // V2.4.0-J: Output bar.beat format
                document.getElementById('outBeat').value = beatsToBarBeat(totalBeats);
                showLoopDuration();
            }

        // V2.4.0-G: Quick reset for Audio Start/End via label click
        function setAudioStartToZero() {
            if (audioElement) {
                audioStartTime = 0;
                document.getElementById('audioStartField').value = '00:00.000';
                requestAnimationFrame(drawProgress);

        // V2.1.1-I: Arrow key navigation for IN/OUT with range maintenance
        function setupInOutArrowKeys() {
            const inBeatInput = document.getElementById('inBeat');
            const outBeatInput = document.getElementById('outBeat');

            function handleArrowKeys(e, isInBeat) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                    
                    // V2.4.0-J: Parse bar.beat format
                    const inBeat = barBeatToBeats(inBeatInput.value);
                    const outBeat = barBeatToBeats(outBeatInput.value);
                    const range = outBeat - inBeat;
                    
                    let delta = 0;
                    // V2.4.0-K: Bar.beat format arrow key increments
                    if (isInBeat) {
                        // Loop In: 1 beat for up/down, 1 bar (4 beats) for left/right
                        if (e.key === 'ArrowUp') delta = 1;          // 1 beat
                        else if (e.key === 'ArrowDown') delta = -1;  // 1 beat
                        else if (e.key === 'ArrowRight') delta = 4;  // 1 bar (4 beats)
                        else if (e.key === 'ArrowLeft') delta = -4;  // 1 bar (4 beats)
                    } else {
                        // Loop Out: 4 bars (16 beats) for up/down, 16 bars (64 beats) for left/right
                        if (e.key === 'ArrowUp') delta = 16;        // 4 bars (16 beats)
                        else if (e.key === 'ArrowDown') delta = -16;  // 4 bars (16 beats)
                        else if (e.key === 'ArrowRight') delta = 64;  // 16 bars (64 beats)
                        else if (e.key === 'ArrowLeft') delta = -64;  // 16 bars (64 beats)
                    }
                    
                    let newIn, newOut;
                    
                    // V2.2.0-H: Arrow keys always move both brackets together (maintain loop length)
                    newIn = inBeat + delta;
                    newOut = outBeat + delta;
                    
                    // Clamp to valid ranges
                    if (newIn < 0) {
                        newIn = 0;
                        newOut = range;
                    }
                    
                    // V2.4.0-K: Format to bar.beat for display
                    inBeatInput.value = beatsToBarBeat(Math.max(0, newIn));
                    outBeatInput.value = beatsToBarBeat(Math.max(1, newOut));
                    
                    showLoopDuration();
                    
                    // V2.4.0-B: Jump audio to new IN position (relative to Audio Start)
                    if (audioLoaded && audioElement) {
                        const tempo = audioTempo;  // Use audio tempo, NOT shader tempo
                        const beatsPerSecond = tempo / 60.0;
                        audioElement.currentTime = audioStartTime + (newIn / beatsPerSecond);
                    }
                }
            }

            inBeatInput.addEventListener('keydown', (e) => handleArrowKeys(e, true));
            outBeatInput.addEventListener('keydown', (e) => handleArrowKeys(e, false));
            
        }

        async function setupAudioLibrary() {

                    return;
                }

                }
            }

        async function storeAudioLibraryHandle(handle) {
            const db = await openLibraryDB();
            const tx = db.transaction('settings', 'readwrite');
            await tx.objectStore('settings').put(handle, 'audioLibraryHandle');
        }
        
        async function loadAudioLibraryHandle() {
            try {
                const db = await openLibraryDB();
                const tx = db.transaction('settings', 'readonly');
                const handle = await tx.objectStore('settings').get('audioLibraryHandle');
                
                if (handle) {
                    // Verify permission
                    const permission = await handle.queryPermission({ mode: 'read' });
                    if (permission === 'granted' || permission === 'prompt') {
                        audioLibraryHandle = handle;
                        // V2.8.0-M: Show info box with folder name
                        document.getElementById('audioLibraryInfo').style.display = 'block';
                        document.getElementById('audioLibraryFolderName').textContent = handle.name;
                        document.getElementById('setupLibraryBtn').textContent = 'Change Audio Library';
                        return true;
                    }
                }
            } catch (error) {
                // (no-op)
            }
            return false;
        }
        
        async function openLibraryDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('OMSDojo', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings');
                    }
                };
            });
        }

                return file;

        async function loadContainer(containerId) {
            const containers = getLibraryContainers();
            const container = containers.find(c => c.id === containerId);
            if (!container) {
                showStatus('Container not found', 'error');
                return;
            }
            
            document.getElementById('shaderCode').value = container.shaderCode;
            
            if (container.controlStates) {
                applyControlState(container.controlStates);
            }
            
            // V2.8.0-L: Load audio from library folder if filename exists
            if (container.audioFilename) {
                try {
                    if (!audioLibraryHandle) {
                        showStatus(`Container loaded. Please load audio: ${container.audioFilename}`, 'info');
                    } else {
                        const file = await getAudioFromLibrary(container.audioFilename);
                        const fakeEvent = { target: { files: [file] } };
                        await loadAudioFile(fakeEvent);
                    }
                } catch (error) {
                    showStatus(`Container loaded. Audio not found: ${container.audioFilename}`, 'error');
                }
            } else if (container.audioData) {
                // V2.8.0-L: Backward compatibility for old containers with embedded audio
                try {
                    const response = await fetch(container.audioData);
                    const blob = await response.blob();
                    const file = new File([blob], `${container.name}.mp3`, { type: 'audio/mpeg' });
                    const fakeEvent = { target: { files: [file] } };
                    await loadAudioFile(fakeEvent);
                } catch (error) {
                    showStatus('Container loaded (audio failed)', 'error');
                }
            }
            
            await compileShader();
            showStatus(`Loaded: ${container.name}`, 'success');
        }

            const containers = getLibraryContainers();
            const filtered = containers.filter(c => c.id !== containerId);
            saveLibraryContainers(filtered);
            showStatus('Container removed', 'success');
            refreshLibraryList();
        }
        
        function exportContainer(containerId) {
            const containers = getLibraryContainers();
            const container = containers.find(c => c.id === containerId);
            
            if (!container) {
                showStatus('Container not found', 'error');
                return;
            }
            
            // Create .oms file (JSON format)
            const omsData = {
                format: 'oms-container',
                version: '1.0',
                container: container
            };
            
            const jsonString = JSON.stringify(omsData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            // Create download link
            const a = document.createElement('a');
            a.href = url;
            a.download = `${container.name.replace(/[^a-z0-9]/gi, '_')}.oms`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus(`Exported: ${container.name}`, 'success');
        }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const omsData = JSON.parse(e.target.result);
                    
                    // Validate format
                    if (omsData.format !== 'oms-container' || !omsData.container) {
                        showStatus('Invalid .oms file format', 'error');
                        return;
                    }
                    
                    const container = omsData.container;
                    
                    // Generate new ID and timestamp
                    container.id = Date.now().toString();
                    container.created = new Date().toISOString();
                    
                    // Add to library
                    const containers = getLibraryContainers();
                    containers.push(container);
                    saveLibraryContainers(containers);
                    
                    showStatus(`Imported: ${container.name}`, 'success');
                    refreshLibraryList();
                    
                } catch (error) {
                    showStatus('Failed to import .oms file', 'error');
                }
            };
            reader.readAsText(file);
            
            // Reset file input
            event.target.value = '';

fn fs_main(@builtin(position) coord: vec4<f32>) -> @location(0) vec4<f32> {
    let resolution = vec2<f32>(uniforms.resolutionX, uniforms.resolutionY);
    let time = uniforms.time;
    let modA = uniforms.modA;  // Bass → speed + grid intensity
    let modB = uniforms.modB;  // Mid → color shift

    // Bass-driven tunnel speed and depth

    let depth = 1.0 / max(radius, 0.15);
    let z = depth + time * bassSpeed;
    
    // Grid coordinates
    let gridX = angle * 4.0;
    let gridZ = z * 2.0;
    
    // Create grid lines
    let lineX = abs(fract(gridX) - 0.5);
    let lineZ = abs(fract(gridZ) - 0.5);

    let thicknessMod = baseThickness * (1.0 + modA * 0.5);

                name: "Instagram Story",
                tempo: 120,
                loopLength: 16,
                renderDuration: "00:15.000",
                audioPitch: 0,  // V2.8.0-D
                modASubdiv: 1, modAWaveform: "sine", modAGain: 0.1, modAFreq1: 30, modAFreq2: 50,
                modBSubdiv: 4, modBWaveform: "sawtooth", modBGain: 0.1, modBFreq1: 50, modBFreq2: 75,
                modCSubdiv: 4, modCWaveform: "triangle", modCGain: 0.1, modCFreq1: 100, modCFreq2: 500,
                orientation: "portrait", resolution: 1080, fps: 30
            },
            tiktok: {
                name: "TikTok",
                tempo: 120,
                loopLength: 16,
                renderDuration: "00:30.000",
                audioPitch: 0,  // V2.8.0-D
                modASubdiv: 1, modAWaveform: "sine", modAGain: 0.1, modAFreq1: 30, modAFreq2: 50,
                modBSubdiv: 4, modBWaveform: "sawtooth", modBGain: 0.1, modBFreq1: 50, modBFreq2: 75,
                modCSubdiv: 4, modCWaveform: "triangle", modCGain: 0.1, modCFreq1: 100, modCFreq2: 500,
                orientation: "portrait", resolution: 1080, fps: 60
            }
        };

        function getCurrentControlState() {
            // V2.7.0-R: Added null checks for elements that might not exist on page load
            const getElementValue = (id, defaultValue) => {
                const element = document.getElementById(id);
                return element ? element.value : defaultValue;
            };
            
            // V2.7.0-X: Helper to parse numeric values and allow 0
            const parseNumeric = (value, defaultValue, parser) => {
                const parsed = parser(value);
                return isNaN(parsed) ? defaultValue : parsed;
            };
            
            return {
                tempo: parseNumeric(getElementValue('tempo', '120'), 120, parseInt),
                loopLength: parseNumeric(getElementValue('loopLength', '16'), 16, parseFloat),
                renderDuration: getElementValue('renderDuration', '00:30.000') || "00:30.000",
                audioPitch: parseNumeric(getElementValue('pitchField', '0'), 0, parseFloat), // V2.8.0-D
                modASubdiv: parseNumeric(getElementValue('modASubdiv', '1'), 1, parseFloat),
                modAWaveform: getElementValue('modAWaveform', 'sine') || "sine",
                modAGain: parseNumeric(getElementValue('modAGain', '0.1'), 0.1, parseFloat),
                modAFreq1: parseNumeric(getElementValue('modAFreq1', '30'), 30, parseInt),
                modAFreq2: parseNumeric(getElementValue('modAFreq2', '50'), 50, parseInt),
                modBSubdiv: parseNumeric(getElementValue('modBSubdiv', '4'), 4, parseFloat),
                modBWaveform: getElementValue('modBWaveform', 'sawtooth') || "sawtooth",
                modBGain: parseNumeric(getElementValue('modBGain', '0.1'), 0.1, parseFloat),
                modBFreq1: parseNumeric(getElementValue('modBFreq1', '50'), 50, parseInt),
                modBFreq2: parseNumeric(getElementValue('modBFreq2', '75'), 75, parseInt),
                modCSubdiv: parseNumeric(getElementValue('modCSubdiv', '4'), 4, parseFloat),
                modCWaveform: getElementValue('modCWaveform', 'triangle') || "triangle",
                modCGain: parseNumeric(getElementValue('modCGain', '0.1'), 0.1, parseFloat),
                modCFreq1: parseNumeric(getElementValue('modCFreq1', '100'), 100, parseInt),
                modCFreq2: parseNumeric(getElementValue('modCFreq2', '500'), 500, parseInt),
                orientation: getElementValue('orientation', 'portrait') || "portrait",
                resolution: parseNumeric(getElementValue('resolution', '1080'), 1080, parseInt),
                fps: parseNumeric(getElementValue('fps', '30'), 30, parseInt)
            };
        }

        function applyControlState(state) {
            document.getElementById('tempo').value = state.tempo;
            document.getElementById('loopLength').value = state.loopLength;
            document.getElementById('renderDuration').value = state.renderDuration;
            
            // V2.8.0-D: Apply pitch if present in state
            if (state.audioPitch !== undefined) {
                audioPitch = state.audioPitch;
                document.getElementById('pitchField').value = audioPitch.toFixed(2);
                applyPitchToAudio();
            }
            
            document.getElementById('modASubdiv').value = state.modASubdiv;
            document.getElementById('modAWaveform').value = state.modAWaveform;  // Updated: now consistent
            document.getElementById('modAGain').value = state.modAGain;           // Updated: now consistent
            
            // V2.7.0-W: Temporarily enable frequency fields to allow value updates
            const freqFields = ['modAFreq1', 'modAFreq2', 'modBFreq1', 'modBFreq2', 'modCFreq1', 'modCFreq2'];
            const wasDisabled = freqFields.map(id => document.getElementById(id).disabled);
            
            // Enable all frequency fields
            freqFields.forEach(id => document.getElementById(id).disabled = false);
            
            // Set frequency values
            document.getElementById('modAFreq1').value = state.modAFreq1;
            document.getElementById('modAFreq2').value = state.modAFreq2;
            document.getElementById('modBFreq1').value = state.modBFreq1;
            document.getElementById('modBFreq2').value = state.modBFreq2;
            document.getElementById('modCFreq1').value = state.modCFreq1;
            document.getElementById('modCFreq2').value = state.modCFreq2;
            
            // Restore disabled state based on audio presence
            const hasAudio = !!audioElement.src;
            freqFields.forEach(id => document.getElementById(id).disabled = !hasAudio);
            
            document.getElementById('modBSubdiv').value = state.modBSubdiv;
            document.getElementById('modBWaveform').value = state.modBWaveform;  // Updated: now consistent
            document.getElementById('modBGain').value = state.modBGain;           // Updated: now consistent
            document.getElementById('modCSubdiv').value = state.modCSubdiv;
            document.getElementById('modCWaveform').value = state.modCWaveform;  // Updated: now consistent
            document.getElementById('modCGain').value = state.modCGain;           // Updated: now consistent
            document.getElementById('orientation').value = state.orientation;
            document.getElementById('resolution').value = state.resolution;
            document.getElementById('fps').value = state.fps;
            
            // Update currentTempo global
            currentTempo = state.tempo;
        }

        function saveControlState() {
            // V2.7.0-S: Show inline input instead of prompt dialog
            const saveRow = document.getElementById('saveInputRow');
            const saveInput = document.getElementById('saveStateName');
            
            saveRow.style.display = 'flex';
            saveInput.value = '';
            saveInput.focus();
            
            // Allow Enter key to confirm
            saveInput.onkeypress = function(e) {
                if (e.key === 'Enter') {
                    confirmSaveControlState();
                } else if (e.key === 'Escape') {
                    cancelSaveControlState();
                }
            };
        }
        
        function confirmSaveControlState() {
            const nameInput = document.getElementById('saveStateName');
            const name = nameInput.value.trim();
            
            if (!name) {
                showStatus('Please enter a name for the Control State', 'error');
                return;
            }
            
            const state = getCurrentControlState();
            state.name = name;
            
            // Get existing user states
            let userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
            
            // Generate safe ID from name
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            userStates[id] = state;
            
            // Save to localStorage
            localStorage.setItem('controlStates', JSON.stringify(userStates));
            
            // Update dropdown
            updateControlStatesDropdown();
            
            // Select the newly saved state
            const select = document.getElementById('controlStateSelect');
            select.value = id;
            
            // V2.7.0-Q: Update info box (Custom always visible now)
            updateControlStateInfo();
            
            // Hide save input row
            document.getElementById('saveInputRow').style.display = 'none';
            
            showStatus(`Control State "${name}" saved`, 'success');
        }
        
        function cancelSaveControlState() {
            // Hide save input row
            document.getElementById('saveInputRow').style.display = 'none';
            showStatus('Save cancelled', 'info');
        }
        
        // Legacy function - now just calls the new inline version
        function saveControlState_OLD_PROMPT() {
            const name = prompt("Enter name for this Control State:");
            if (!name || name.trim() === "") return;
            
            const state = getCurrentControlState();
            state.name = name.trim();
            
            // Get existing user states
            let userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
            
            // Generate safe ID from name
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            userStates[id] = state;
            
            // Save to localStorage
            localStorage.setItem('controlStates', JSON.stringify(userStates));
            
            // Update dropdown
            updateControlStatesDropdown();
            
            // Select the newly saved state
            const select = document.getElementById('controlStateSelect');
            select.value = id;
            
            // V2.7.0-Q: Update info box (Custom always visible now)
            updateControlStateInfo();
            
            showStatus(`Control State "${name}" saved`, 'success');
        }

        function deleteControlState() {
            const select = document.getElementById('controlStateSelect');
            const selectedId = select.value;
            
            if (!selectedId || selectedId === "") {
                showStatus('No Control State selected', 'error');
                return;
            }
            
            // Check if it's a library state (can't delete)
            if (CONTROL_STATE_LIBRARY[selectedId]) {
                showStatus('Cannot delete library Control States', 'error');
                return;
            }
            
            // Get user states
            let userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
            
            if (!userStates[selectedId]) {
                showStatus('Control State not found', 'error');
                return;
            }
            
            const stateName = userStates[selectedId].name;
            delete userStates[selectedId];
            
            // Save updated states
            localStorage.setItem('controlStates', JSON.stringify(userStates));
            
            // Update dropdown
            updateControlStatesDropdown();
            
            // Reset selection to Default
            select.value = "";
            
            showStatus(`Control State "${stateName}" deleted`, 'success');
        }

        function updateControlStatesDropdown() {
            const select = document.getElementById('controlStateSelect');
            const currentSelection = select.value;
            
            // V2.7.0-M: Clear existing options and add Custom option (hidden by default)
            select.innerHTML = '<option value="custom" style="display: none;">Custom</option><option value="">Default</option><option disabled>--- Library ---</option>';
            
            // Add library states
            for (const [id, state] of Object.entries(CONTROL_STATE_LIBRARY)) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = state.name;
                select.appendChild(option);
            }
            
            // Add user states separator
            const userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
            if (Object.keys(userStates).length > 0) {
                const separator = document.createElement('option');
                separator.disabled = true;
                separator.textContent = '--- User States ---';
                select.appendChild(separator);
                
                // Add user states
                for (const [id, state] of Object.entries(userStates)) {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = state.name;
                    select.appendChild(option);
                }
            }
            
            // V2.7.0-Q: Restore selection if still valid
            if (currentSelection) {
                select.value = currentSelection;
            }
        }

        // Control State dropdown change handler
        document.getElementById('controlStateSelect').addEventListener('change', (e) => {
            const selectedId = e.target.value;
            
            if (selectedId === "custom") {
                // Custom state - show info box with current values
                updateControlStateInfo();
                return;
            }
            
            // Check library states first
            if (CONTROL_STATE_LIBRARY[selectedId]) {
                applyControlState(CONTROL_STATE_LIBRARY[selectedId]);
                // V2.7.0-Z: Delay info box update to ensure DOM updates complete
                setTimeout(() => updateControlStateInfo(), 0);
                showStatus(`Loaded library state: ${CONTROL_STATE_LIBRARY[selectedId].name}`, 'success');
                return;
            }
            
            // Check user states
            const userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
            if (userStates[selectedId]) {
                applyControlState(userStates[selectedId]);
                // V2.7.0-Z: Delay info box update to ensure DOM updates complete
                setTimeout(() => updateControlStateInfo(), 0);
                showStatus(`Loaded user state: ${userStates[selectedId].name}`, 'success');
                return;
            }
        });

        // V2.7.0-M: Update Control State Info Box
        // V2.7.0-P: Added debugging and error handling
        function updateControlStateInfo() {
            try {
                const infoBox = document.getElementById('controlStateInfo');
                if (!infoBox) {
                    return;
                }
                
                const titleDiv = infoBox.querySelector('.control-state-info-title');
                const contentDiv = infoBox.querySelector('.control-state-info-content');
                if (!titleDiv || !contentDiv) {
                    return;
                }
                
                const selectedId = document.getElementById('controlStateSelect').value;
                
                // Get state info
                let state, stateName;
                if (selectedId === "custom") {
                    state = getCurrentControlState();
                    stateName = "Custom";
                } else if (CONTROL_STATE_LIBRARY[selectedId]) {
                    state = CONTROL_STATE_LIBRARY[selectedId];
                    stateName = state.name;
                } else {
                    const userStates = JSON.parse(localStorage.getItem('controlStates') || '{}');
                    state = userStates[selectedId];
                    stateName = state ? state.name : "Unknown";
                }
                
                if (!state) {
                    infoBox.style.display = 'none';
                    return;
                }
                
                // V2.7.0-T: Hide title div (no state name shown)
                titleDiv.style.display = 'none';
                
                const waveformNames = { sine: "Sine", square: "Square", sawtooth: "Sawtooth", triangle: "Triangle" };
                const subdivNames = { 4: "Whole", 2: "Half", 1: "1/4", 0.5: "1/8", 0.25: "1/16", 16: "4 Bars", 32: "8 Bars", 64: "16 Bars", 128: "32 Bars" };
                
                const loopText = subdivNames[state.loopLength] || state.loopLength + ' beats';
                
                // V2.8.0-D: Include pitch in timing info
                const pitchText = state.audioPitch !== undefined && state.audioPitch !== 0 
                    ? `, Pitch: ${state.audioPitch >= 0 ? '+' : ''}${state.audioPitch.toFixed(2)}%` 
                    : '';
                
                contentDiv.innerHTML = `
                    <div class="info-row-single"><strong>Timing:</strong> ${state.tempo}bpm, ${loopText}, ${state.renderDuration}${pitchText}</div>
                    <div class="info-row">
                        <span class="info-label">Mod A:</span>
                        <span class="info-subdiv">${subdivNames[state.modASubdiv] || state.modASubdiv}</span>
                        <span class="info-wave">${waveformNames[state.modAWaveform] || state.modAWaveform}</span>
                        <span class="info-gain">${state.modAGain}</span>
                        <span class="info-freq">${state.modAFreq1}-${state.modAFreq2}Hz</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Mod B:</span>
                        <span class="info-subdiv">${subdivNames[state.modBSubdiv] || state.modBSubdiv}</span>
                        <span class="info-wave">${waveformNames[state.modBWaveform] || state.modBWaveform}</span>
                        <span class="info-gain">${state.modBGain}</span>
                        <span class="info-freq">${state.modBFreq1}-${state.modBFreq2}Hz</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Mod C:</span>
                        <span class="info-subdiv">${subdivNames[state.modCSubdiv] || state.modCSubdiv}</span>
                        <span class="info-wave">${waveformNames[state.modCWaveform] || state.modCWaveform}</span>
                        <span class="info-gain">${state.modCGain}</span>
                        <span class="info-freq">${state.modCFreq1}-${state.modCFreq2}Hz</span>
                    </div>
                    <div class="info-row-single"><strong>Output:</strong> ${state.orientation.charAt(0).toUpperCase() + state.orientation.slice(1)}, ${state.resolution}p, ${state.fps} FPS</div>
                `;
                
                infoBox.style.display = 'block';
            } catch (error) {
                // (no-op)
            }
        }

        // V2.7.0-M: Mark state as Custom when controls change
        // V2.7.0-Q: Simplified - Custom always visible
        function markAsCustomState() {
            const select = document.getElementById('controlStateSelect');
            select.value = 'custom';
            
            // Update info box
            updateControlStateInfo();
        }

        // V2.7.0-AD: Add change listeners to control fields
        // Note: renderDuration and freq fields handled in audio load/remove handlers
        const controlFields = [
            'tempo', 'loopLength',
            'modASubdiv', 'modAWaveform', 'modAGain',
            'modBSubdiv', 'modBWaveform', 'modBGain',
            'modCSubdiv', 'modCWaveform', 'modCGain',
            'orientation', 'resolution', 'fps'
        ];

        controlFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('change', markAsCustomState);
                field.addEventListener('input', markAsCustomState);
            }
        });

        // V2.7.0-AE: Add renderDuration listener with debugging
        const renderDurationField = document.getElementById('renderDuration');
        if (renderDurationField) {
            renderDurationField.oninput = function() {
                markAsCustomState();
            };
        }

        // V2.8.0-A: BroadcastChannel communication for DojoLive
        function announcePresence() {
            try {
                const shaderName = getShaderNameFromCode() || 'Dojo Instance';
                
                liveChannel.postMessage({
                    type: 'announce',
                    id: instanceId,
                    name: shaderName,
                    timestamp: Date.now()
                });
                
                isBroadcasting = true;
            } catch (error) {
                // (no-op)
            }
        }
        
        function getShaderNameFromCode() {
            const codeEditor = document.getElementById('shaderCode');
            if (!codeEditor) return null;
            
            const code = codeEditor.value;
            // Extract name from first comment line like: // Bass Tunnel v3
            const match = code.match(/^\/\/\s*(.+)$/m);
            return match ? match[1].trim() : null;
        }
        
        // V2.8.0-B: Broadcast canvas snapshot
        function broadcastSnapshot() {
            try {
                if (!canvas) {
                    return;
                }
                
                // Capture canvas as base64 image data
                const imageData = canvas.toDataURL('image/jpeg', 0.8); // 80% quality JPEG
                
                liveChannel.postMessage({
                    type: 'snapshot',
                    id: instanceId,
                    imageData: imageData,
                    timestamp: Date.now()
                });
                
            } catch (error) {
                // (no-op)
            }
        }
        
        function startHeartbeat() {
            setInterval(() => {
                if (isBroadcasting) {
                    announcePresence();
                }
            }, 5000);
        }
        
        // V2.8.0-A: Listen for control messages from DojoLive
        liveChannel.onmessage = (event) => {
            const msg = event.data;
            
            // Future: Handle scene launch commands, preset switches, etc.
            if (msg.type === 'control' && msg.target === instanceId) {
                // (no-op)
            }
        };

        // V2.7.0-L: Initialize control states dropdown on load
        updateControlStatesDropdown();
        
        // V2.7.0-Q: Show info box on load with Custom state
        updateControlStateInfo();

        // V2.6.0-B: Initialize preset cards on page load
        generatePresetCards()
;
        generateUserPresetCards(); // V2.6.0-S: Initialize user preset cards
        
        // V2.8.0-A: Initialize BroadcastChannel
        announcePresence(); // Announce on page load
        startHeartbeat(); // Start 5-second heartbeat
        
        // V2.8.0-L: Load audio library handle from IndexedDB
        loadAudioLibraryHandle().then(loaded => {
            if (loaded) {
                // (no-op)
            }
        });
        
        // V2.8.0-C: Auto-snapshot on page load (500ms delay for canvas render)
        setTimeout(() => {
            broadcastSnapshot();
        }, 500);
        
        // V2.8.0-A: Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            liveChannel.close();
        });
    </script>
</body>
</html>
