                                <option value="square" selected>Square</option>
                                <option value="chaos">Chaos</option>
                                <option value="noise">Noise</option>
                                <option value="random">Random</option>

                    <div class="control-row">
                        <button class="btn btn-compact" data-tooltip="Compile" onclick="compileShader()">C</button>
                        <input type="text" id="filename" class="control-group input" value="filename" placeholder="Enter name" title="Custom filename (settings auto-added)" style="flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px 15px; border-radius: 6px; font-size: 14px;">

            <div class="code-section">

                <textarea class="editor" id="shaderCode" placeholder="Paste your shader code here...">
// ONEMANSHYO Dojo V2 - Modulation System
// Available uniforms:
//   uniforms.time - elapsed time in seconds
//   uniforms.tempo - tempo in BPM (beats per minute)
//   uniforms.modA - modulation source A (0.0-1.0, tempo-synced)
//   uniforms.modB - modulation source B (0.0-1.0, tempo-synced)
//   uniforms.modC - modulation source C (0.0-1.0, tempo-synced)
//   uniforms.resolution - vec2<f32> canvas dimensions

@fragment
fn fs_main(@builtin(position) coord: vec4<f32>) -> @location(0) vec4<f32> {
    let resolution = uniforms.resolution;
    let time = uniforms.time;
    let tempo = uniforms.tempo;
    
    // Convert tempo (BPM) to beats
    let beatsPerSecond = tempo / 60.0;
    let beat = time * beatsPerSecond;
    
    let uv = coord.xy / resolution;
    let center = uv - 0.5;
    
    // Map modA to rotation speed (1/4 note sine by default)
    let rotationSpeed = uniforms.modA * 2.0;
    let angle = beat * rotationSpeed;
    let cos_a = cos(angle);
    let sin_a = sin(angle);
    let rotated = vec2<f32>(
        center.x * cos_a - center.y * sin_a,
        center.x * sin_a + center.y * cos_a
    );
    
    let dist = length(rotated);
    
    // Map modB to spiral intensity (1/8 note sawtooth by default)
    let spiralFreq = 15.0 + uniforms.modB * 20.0;
    let spiral = sin(dist * spiralFreq - beat * 4.0) * 0.5 + 0.5;
    
    // Map modC to pulse (1/16 note square by default)
    let pulse = 0.5 + uniforms.modC * 0.5;
    
    // Color gradient synced to tempo
    let color = vec3<f32>(
        sin(beat + uv.x * 3.14159) * 0.5 + 0.5,
        sin(beat + 1.0 + uv.y * 3.14159) * 0.5 + 0.5,
        sin(beat + 2.0 + dist * 6.28318) * 0.5 + 0.5
    );
    
    return vec4<f32>(color * (spiral * pulse), 1.0);
}
                </textarea>
            </div>
        </div>
        
        <div class="preview-panel">
            <div class="preview-container">
                <canvas id="canvas" class="canvas"></canvas>
                <div class="progress-overlay" id="progressOverlay">
                    <div class="progress-circle"></div>
                    <div class="progress-text" id="progressText">Processing...</div>
                </div>
                <span id="shaderStatus" class="status">WebGPU Ready</span>
            </div>
        </div>
    </div>

    <script>
        let device, context, pipeline, canvas;
        let uniformBuffer, uniformBindGroup;
        let startTime = Date.now();
        let isRendering = false;
        let animationId;
        let currentTempo = 120;
        
        // Noise state for smooth noise generation
        let noiseState = { a: 0, b: 0, c: 0 };

        // Waveform calculation functions
        function calculateMod(beat, subdivision, waveform) {
            const freq = 1.0 / subdivision; // Convert subdivision to frequency multiplier
            const phase = (beat * freq) % 1.0;
            
            switch(waveform) {
                case 'sine':
                    return Math.sin(phase * Math.PI * 2) * 0.5 + 0.5;
                case 'cosine':
                    return Math.cos(phase * Math.PI * 2) * 0.5 + 0.5;
                case 'sawtooth':
                    return phase;
                case 'triangle':
                    return phase < 0.5 ? phase * 2 : (1 - phase) * 2;
                case 'square':
                    return phase < 0.5 ? 0.0 : 1.0;
                case 'chaos':
                    return (Math.sin(beat * 3.7) * Math.cos(beat * 7.1) * Math.sin(beat * 2.3)) * 0.5 + 0.5;
                case 'noise':
                    // Smooth noise using sine interpolation
                    const t = beat * freq * 0.1;
                    noiseState.a = Math.sin(t * 12.9898) * 43758.5453;
                    noiseState.a = noiseState.a - Math.floor(noiseState.a);
                    return noiseState.a;
                case 'random':
                    // Random jumps on beat boundaries
                    const beatCount = Math.floor(beat * freq);
                    return Math.abs(Math.sin(beatCount * 78.233) * 43758.5453) % 1.0;
                case 'fibonacci':
                    const phi = 1.618033988749895;
                    return (Math.sin(beat * freq * phi) * 0.5 + 0.5);
                case 'prime':
                    // Use prime number ratios for complex evolution
                    return (Math.sin(beat * freq * 3.14159) * Math.cos(beat * freq * 2.71828)) * 0.5 + 0.5;
                default:
                    return 0.5;
            }
        }

        // Update Duration input
        document.getElementById('duration').addEventListener('input', (e) => {
            let value = parseInt(e.target.value);
            if (value < 1) value = 1;
            if (value > 600) value = 600;
            e.target.value = value;
        });

        // Update Tempo input
        document.getElementById('tempo').addEventListener('input', (e) => {
            let value = parseInt(e.target.value);
            if (value < 1) value = 1;
            if (value > 999) value = 999;
            e.target.value = value;
            currentTempo = value;
        });

        // Initialize WebGPU
        async function initWebGPU() {
            if (!navigator.gpu) {
                showStatus('WebGPU not supported. Please use Chrome/Safari on M1 Mac.', 'error');
                return false;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    showStatus('No WebGPU adapter found', 'error');
                    return false;
                }

                device = await adapter.requestDevice();
                canvas = document.getElementById('canvas');
                context = canvas.getContext('webgpu');
                
                const format = navigator.gpu.getPreferredCanvasFormat();
                context.configure({
                    device: device,
                    format: format,
                });

                updateCanvasSize();
                showStatus('WebGPU initialized successfully', 'success');
                return true;
                
            } catch (error) {
                showStatus('WebGPU initialization failed: ' + error.message, 'error');
                return false;
            }
        }

        function updateCanvasSize() {
            const resolution = document.getElementById('resolution').value;
            const orientation = document.getElementById('orientation').value;
            let width, height;
            
            // Get base resolution
            if (resolution === '720') {
                width = 1280;
                height = 720;
            } else { // 1080p
                width = 1920;
                height = 1080;
            }
            
            // Swap for portrait
            if (orientation === 'portrait') {
                [width, height] = [height, width];
            }
            
            canvas.width = width;
            canvas.height = height;
            
            // Scale display to fit container
            const container = canvas.parentElement;
            const containerRect = container.getBoundingClientRect();
            const aspectRatio = width / height;
            
            if (containerRect.width / aspectRatio <= containerRect.height * 0.9) {
                canvas.style.width = containerRect.width * 0.9 + 'px';
                canvas.style.height = (containerRect.width * 0.9) / aspectRatio + 'px';
            } else {
                canvas.style.height = containerRect.height * 0.9 + 'px';
                canvas.style.width = (containerRect.height * 0.9) * aspectRatio + 'px';
            }
            
            // Update status with current dimensions
            const orientationText = orientation === 'portrait' ? 'Portrait' : 'Landscape';
            showStatus(`${resolution}p ${orientationText} (${width}×${height})`, 'success');
        }

        // Compile shader
        async function compileShader() {
            if (!device) return;

            const shaderCode = document.getElementById('shaderCode').value;
            
            // Create vertex shader (fullscreen quad)
            const vertexShaderCode = `
                @vertex
                fn vs_main(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4<f32> {
                    var pos = array<vec2<f32>, 6>(
                        vec2<f32>(-1.0, -1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>(-1.0,  1.0),
                        vec2<f32>( 1.0, -1.0),
                        vec2<f32>( 1.0,  1.0),
                        vec2<f32>(-1.0,  1.0)
                    );
                    return vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                }
            `;

            // Add uniform structure to fragment shader with Tempo and Mods
            const fragmentShaderCode = `
                struct Uniforms {
                    time: f32,
                    tempo: f32,
                    modA: f32,
                    modB: f32,
                    modC: f32,
                    resolution: vec2<f32>,
                }

                @group(0) @binding(0) var<uniform> uniforms: Uniforms;

                ${shaderCode}
            `;

            try {
                const shaderModule = device.createShaderModule({
                    code: vertexShaderCode + '\n' + fragmentShaderCode
                });

                // Create uniform buffer - 32 bytes: time(4) + tempo(4) + modA(4) + modB(4) + modC(4) + resolution(8) + padding(4)
                uniformBuffer = device.createBuffer({
                    size: 32,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });

                // Create bind group layout
                const bindGroupLayout = device.createBindGroupLayout({
                    entries: [{
                        binding: 0,
                        visibility: GPUShaderStage.FRAGMENT,
                        buffer: { type: 'uniform' }
                    }]
                });

                // Create bind group
                uniformBindGroup = device.createBindGroup({
                    layout: bindGroupLayout,
                    entries: [{
                        binding: 0,
                        resource: { buffer: uniformBuffer }
                    }]
                });

                // Create render pipeline
                pipeline = device.createRenderPipeline({
                    layout: device.createPipelineLayout({
                        bindGroupLayouts: [bindGroupLayout]
                    }),
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vs_main'
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: 'fs_main',
                        targets: [{
                            format: navigator.gpu.getPreferredCanvasFormat()
                        }]
                    },
                    primitive: {
                        topology: 'triangle-list'
                    }
                });

                startTime = Date.now();
                showStatus('Shader compiled - Tempo: ' + currentTempo + ' BPM | Mods: A/B/C Active', 'success');
                
                if (!animationId) {
                    render();
                }
                
            } catch (error) {
                showStatus('Shader compilation error: ' + error.message, 'error');
            }
        }

        // Render loop
        function render() {
            if (!device || !pipeline) {
                animationId = requestAnimationFrame(render);
                return;
            }

            const currentTime = (Date.now() - startTime) / 1000.0;
            const beatsPerSecond = currentTempo / 60.0;
            const beat = currentTime * beatsPerSecond;
            
            // Get mod settings
            const modASubdiv = parseFloat(document.getElementById('modASubdiv').value);
            const modAWave = document.getElementById('modAWave').value;
            const modBSubdiv = parseFloat(document.getElementById('modBSubdiv').value);
            const modBWave = document.getElementById('modBWave').value;
            const modCSubdiv = parseFloat(document.getElementById('modCSubdiv').value);
            const modCWave = document.getElementById('modCWave').value;
            
            // Calculate mod values
            const modA = calculateMod(beat, modASubdiv, modAWave);
            const modB = calculateMod(beat, modBSubdiv, modBWave);
            const modC = calculateMod(beat, modCSubdiv, modCWave);
            
            // Update uniforms: time, tempo, modA, modB, modC, resolution.x, resolution.y, padding
            const uniformData = new Float32Array([
                currentTime,
                currentTempo,
                modA,
                modB,
                modC,
                0, // padding to align resolution
                canvas.width,
                canvas.height
            ]);
            
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);

            // Render
            const commandEncoder = device.createCommandEncoder();
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: { r: 0, g: 0, b: 0, a: 1 },
                    loadOp: 'clear',
                    storeOp: 'store'
                }]
            });

            renderPass.setPipeline(pipeline);
            renderPass.setBindGroup(0, uniformBindGroup);
            renderPass.draw(6);
            renderPass.end();

            device.queue.submit([commandEncoder.finish()]);
            
            animationId = requestAnimationFrame(render);
        }

        // Start video rendering
        async function startRender() {
            if (isRendering) return;
            
            isRendering = true;
            const renderBtn = document.getElementById('renderBtn');
            renderBtn.classList.add('rendering');
            renderBtn.disabled = true;
            
            document.getElementById('progressOverlay').style.display = 'flex';
            document.getElementById('progressText').textContent = 'Setting up render...';
            
            try {
                const duration = parseInt(document.getElementById('duration').value);
                const fps = parseInt(document.getElementById('fps').value);
                const resolution = document.getElementById('resolution').value;
                const orientation = document.getElementById('orientation').value;
                const filename = document.getElementById('filename').value.trim() || 'filename';
                
                // Use canvas recording for now - more compatible
                const stream = canvas.captureStream(fps);
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 8000000 // High quality
                });
                
                const chunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `OMS_${filename}_${resolution}p_${fps}fps_${duration}s_${currentTempo}bpm.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    finishRender('Video rendered successfully!');
                };
                
                mediaRecorder.start();
                const minutes = Math.floor(duration / 60);
                const seconds = duration % 60;
                let timeText = duration + 's';
                if (minutes > 0) {
                    timeText = seconds > 0 ? `${minutes}m ${seconds}s` : `${minutes}m`;
                }
                document.getElementById('progressText').textContent = `Rendering ${timeText} @ ${currentTempo} BPM...`;
                
                setTimeout(() => {
                    mediaRecorder.stop();
                }, duration * 1000);
                
            } catch (error) {
                finishRender('Render failed: ' + error.message, true);
            }
        }

        function finishRender(message, isError = false) {
            isRendering = false;
            const renderBtn = document.getElementById('renderBtn');
            renderBtn.classList.remove('rendering');
            renderBtn.disabled = false;
            
            document.getElementById('progressOverlay').style.display = 'none';
            showStatus(message, isError ? 'error' : 'success');
        }

        function showStatus(message, type = '') {
            const status = document.getElementById('shaderStatus');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        // Event listeners
        document.getElementById('resolution').addEventListener('change', () => {
            updateCanvasSize();
            if (pipeline) compileShader();
        });

        document.getElementById('orientation').addEventListener('change', () => {
            updateCanvasSize();
            if (pipeline) compileShader();
        });

        // Initialize
        initWebGPU().then(success => {
            if (success) {
                compileShader();
            }
        });
    </script>
</body>
</html>
